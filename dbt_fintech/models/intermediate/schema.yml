version: 2

models:
  - name: int_user_transaction_velocity
    description: "Velocidad de transacciones por usuario en ventanas 5/15/60 min."
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: cnt_5min
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1